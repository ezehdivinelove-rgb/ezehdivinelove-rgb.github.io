<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Holy Bible - KJV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            color: #2c2c2c;
            line-height: 1.8;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #d4c5a9; }
        h1 { font-size: 2em; font-weight: normal; letter-spacing: 3px; color: #4a3728; }
        .subtitle { font-size: 0.9em; color: #8b7355; font-style: italic; margin-top: 5px; }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; padding: 15px; background: #f5f0e8; border-radius: 8px; align-items: center; }
        .control-group { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
        label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; color: #6b5b4a; margin-bottom: 5px; }
        select { padding: 8px; font-size: 1em; font-family: 'Georgia', serif; border: 1px solid #c4b5a0; border-radius: 4px; background: #fff; }
        button { padding: 8px 25px; font-size: 1em; font-family: 'Georgia', serif; background: #4a3728; color: #fff; border: none; border-radius: 4px; cursor: pointer; align-self: flex-end; }
        button:hover { background: #6b5b4a; }
        .chapter-view { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); min-height: 300px; }
        .chapter-title { font-size: 1.5em; font-weight: normal; color: #4a3728; margin-bottom: 30px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .verse { margin-bottom: 15px; display: flex; gap: 15px; }
        .verse-number { font-weight: bold; color: #8b7355; min-width: 25px; text-align: right; font-size: 0.9em; padding-top: 3px; }
        .verse-text { text-align: justify; }
        .loading, .error { text-align: center; color: #8b7355; padding: 40px; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>The Holy Bible</h1>
        <div class="subtitle">King James Version</div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>Book</label>
            <select id="bookSelect"></select>
        </div>
        <div class="control-group">
            <label>Chapter</label>
            <select id="chapterSelect"></select>
        </div>
        <button id="loadBtn">Read Chapter</button>
    </div>

    <div id="content" class="chapter-view">
        <div class="loading">Select a book and chapter to begin reading.</div>
    </div>

    <script>
        const BIBLE_BOOKS = [
            {name: "Genesis", chapters: 50}, {name: "Exodus", chapters: 40}, {name: "Leviticus", chapters: 27},
            {name: "Numbers", chapters: 36}, {name: "Deuteronomy", chapters: 34}, {name: "Joshua", chapters: 24},
            {name: "Judges", chapters: 21}, {name: "Ruth", chapters: 4}, {name: "1 Samuel", chapters: 31},
            {name: "2 Samuel", chapters: 24}, {name: "1 Kings", chapters: 22}, {name: "2 Kings", chapters: 25},
            {name: "1 Chronicles", chapters: 29}, {name: "2 Chronicles", chapters: 36}, {name: "Ezra", chapters: 10},
            {name: "Nehemiah", chapters: 13}, {name: "Esther", chapters: 10}, {name: "Job", chapters: 42},
            {name: "Psalms", chapters: 150}, {name: "Proverbs", chapters: 31}, {name: "Ecclesiastes", chapters: 12},
            {name: "Song of Solomon", chapters: 8}, {name: "Isaiah", chapters: 66}, {name: "Jeremiah", chapters: 52},
            {name: "Lamentations", chapters: 5}, {name: "Ezekiel", chapters: 48}, {name: "Daniel", chapters: 12},
            {name: "Hosea", chapters: 14}, {name: "Joel", chapters: 3}, {name: "Amos", chapters: 9},
            {name: "Obadiah", chapters: 1}, {name: "Jonah", chapters: 4}, {name: "Micah", chapters: 7},
            {name: "Nahum", chapters: 3}, {name: "Habakkuk", chapters: 3}, {name: "Zephaniah", chapters: 3},
            {name: "Haggai", chapters: 2}, {name: "Zechariah", chapters: 14}, {name: "Malachi", chapters: 4},
            {name: "Matthew", chapters: 28}, {name: "Mark", chapters: 16}, {name: "Luke", chapters: 24},
            {name: "John", chapters: 21}, {name: "Acts", chapters: 28}, {name: "Romans", chapters: 16},
            {name: "1 Corinthians", chapters: 16}, {name: "2 Corinthians", chapters: 13}, {name: "Galatians", chapters: 6},
            {name: "Ephesians", chapters: 6}, {name: "Philippians", chapters: 4}, {name: "Colossians", chapters: 4},
            {name: "1 Thessalonians", chapters: 5}, {name: "2 Thessalonians", chapters: 3}, {name: "1 Timothy", chapters: 6},
            {name: "2 Timothy", chapters: 4}, {name: "Titus", chapters: 3}, {name: "Philemon", chapters: 1},
            {name: "Hebrews", chapters: 13}, {name: "James", chapters: 5}, {name: "1 Peter", chapters: 5},
            {name: "2 Peter", chapters: 3}, {name: "1 John", chapters: 5}, {name: "2 John", chapters: 1},
            {name: "3 John", chapters: 1}, {name: "Jude", chapters: 1}, {name: "Revelation", chapters: 22}
        ];

        const bookSelect = document.getElementById('bookSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const contentDiv = document.getElementById('content');

        // Populate books
        BIBLE_BOOKS.forEach((book, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = book.name;
            bookSelect.appendChild(opt);
        });

        function updateChapters() {
            const book = BIBLE_BOOKS[bookSelect.value];
            chapterSelect.innerHTML = '';
            for (let i = 1; i <= book.chapters; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                chapterSelect.appendChild(opt);
            }
        }

        async function loadChapter() {
            const bookName = BIBLE_BOOKS[bookSelect.value].name;
            const chapterNum = chapterSelect.value;
            contentDiv.innerHTML = '<div class="loading">Loading Scripture...</div>';

            try {
                // Use bible-api.com which supports CORS and KJV
                const url = `https://bible-api.com/${encodeURIComponent(bookName)}+${chapterNum}?translation=kjv`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                let html = `<h2 class="chapter-title">${data.reference}</h2>`;
                data.verses.forEach(v => {
                    html += `
                        <div class="verse">
                            <span class="verse-number">${v.verse}</span>
                            <span class="verse-text">${v.text}</span>
                        </div>`;
                });
                contentDiv.innerHTML = html;

            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Unable to load chapter. Please check your internet connection and try again.</div>`;
            }
        }

        bookSelect.addEventListener('change', updateChapters);
        document.getElementById('loadBtn').addEventListener('click', loadChapter);

        // Initialize
        updateChapters();
    </script>
</body>
</html>
